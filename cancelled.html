<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your Delife Kitchen checkout payment was cancelled and no payment was taken." />
    <title>Payment Cancelled | Delife Kitchen</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="assets/brand/delife-kitchen-icon-192.png" />
    <link rel="apple-touch-icon" href="assets/brand/delife-kitchen-icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="checkout.css" />
  </head>
  <body>
    <div class="announcement">No payment taken &middot; Your order is still saved</div>
    <header class="site-header"><a class="brand" href="index.html" aria-label="Delife Kitchen home"><img src="assets/brand/delife-kitchen-logo.webp" alt="Delife Kitchen African and Caribbean Cuisine" /></a></header>
    <main class="status-main">
      <section class="status-card">
        <div class="status-mark" aria-hidden="true">←</div>
        <p class="eyebrow">Payment cancelled</p>
        <h1>No worries.<br /><em>Your order is saved.</em></h1>
        <p>You have not been charged. Return to checkout when you are ready, or head back to the menu to make a change.</p>
        <div class="status-actions"><a class="button light" href="checkout.html">Return to checkout</a><a class="button" href="menu.html">Edit order</a></div>
      </section>
    </main>
    <script type="module" src="/identity-flow.js"></script>
  </body>
</html>
